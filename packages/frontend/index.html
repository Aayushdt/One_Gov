<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GovLink — Consent-based government digital service interoperability middleware for scholarship applications." />
    <meta name="theme-color" content="#FDFBF6" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme') || localStorage.getItem('govlink_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = saved === 'dark' ? 'dark' : (saved === 'light' ? 'light' : (prefersDark ? 'dark' : 'light'));
          document.documentElement.setAttribute('data-theme', resolved);
          if (resolved === 'dark') document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#1C1715' : '#FDFBF6');
        } catch (e) {}
      })();
    </script>
    <title>GovLink — Government Digital Service Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
